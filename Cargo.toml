[package]
name = "joularcore-gui-rustic"
version = "0.1.0"
edition = "2024"
authors = ["Adel Noureddine"]
license = "GPL-3.0-only"
repository = "https://github.com/joular/joularcore-gui-rustic"
description = "Joular Core GUI Rustic is an graphical-interface using Joular Core Rustic library to measure power and energy across all systems, OSes and devices"

[[bin]]
name = "joularcoregui"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["vm"]
sbc = ["joularcore-rustic/sbc"]
vm = ["joularcore-rustic/vm"]

[dependencies]
joularcore-rustic = "0.1.0"
clap = { version = "4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "color", "suggestions"] }
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "x11", "wayland"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
log = "0.4.33"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
